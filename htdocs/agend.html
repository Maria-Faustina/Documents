<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewDent - Agendamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agend.css">
</head>
<body>
    <section class="container-agend">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo NewDent" class="logo-img">
            <h1>Faça seu Agendamento</h1>
            <p>com os melhores profissionais.</p>
        </div>

        <form action="agend.php" method="POST" class="form">
            <div class="input-box">
                <input type="text" id="nome" name="nome" placeholder="Primeiro nome" required class="input">
            </div>
            <div class="input-box">
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" required class="input">
            </div>
            <div class="input-box">
                <input type="tel" id="telefone" name="telefone" placeholder="Numero de telefone" inputmode="numeric" maxlength="12" required class="input">
            </div>
            <div class="input-box">
                <input type="text" id="CPF" name="CPF" placeholder="CPF" required class="input" inputmode="numeric" maxlength="14" >
            </div>
            <div class="input-box">
                <label for="Serviços">Escolha um dos nossos serviços</label>
                <select id="servico" name="servico" class="input" required>
                    <option value="">Selecione um serviço</option>
                    <option value="limpeza">Limpeza</option>
                    <option value="clareamentoDental">Clareamento Dental</option>
                    <option value="resinaComposta">Resina composta</option>
                    <option value="reconstruçãoDentaria">reconstruções dentárias</option>
                    <option value="aparelhos">Aparelho</option>
                    <option value="implantesDental">Implantes dental</option>
                </select>
            </div>

            <div class="input-box">
                <label for="horario">Horários de Seg a Sex(08:00 às 18:30)</label>
                <input type="datetime-local" id="horario" name="horario" min="08:00" max="18:30" step="1800" required class="input">
            </div>

            <p><i>O pagamento é feito na clinica no dia da consulta</i></p>
            <button type="submit" class="btn-submit">Agendar</button>
            
            <div class="register-link">
                <p><a href="index.php">Voltar para o Início</a></p>
            </div>
        </form>
    </section>
</body>
