<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>Login - NewDent</title>
</head>
<body>
    <script src="validacao.js" defer></script>

    <section class="login-container">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo NewDent" class="logo-img">
            <h1>Login</h1>
            <p>Bem-vindo de volta à NewDent</p>
        </div>

        <form action="login.php" method="POST" onsubmit="return validarLogin(event)">
            <div class="input-box">
                <input type="email" class="input" id="email" name="email" placeholder="email" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="senha" placeholder="Senha" required class="input">
            </div>

            <!-- Guarda a página que o usuário tentou acessar antes do login. -->
            <input type="hidden" name="redirect" id="redirect">

            <button type="submit" class="btn-submit">Entrar</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                <p><a href="index.php">Voltar para o Início</a></p>
            </div>
        </form>
    </section>

    <script>
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');

        if (redirect === 'agend.html' || redirect === 'agend.php') {
            document.getElementById('redirect').value = redirect;
        }
    </script>
</body>
</html>
