<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewDent - Agendamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agend.css">
</head>
<body>
    <section class="container-agend">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo NewDent" class="logo-img">
            <h1>Faça seu Agendamento</h1>
            <p>com os melhores profissionais.</p>
        </div>

        <form action="agend.php" method="POST" class="form">
            <div class="input-box">
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required class="input">
            </div>
        
            <div class="input-box">
                <input type="tel" id="senha" name="senha" placeholder="Numero de telefone" required class="input">
            </div>
        
            <div class="input-box">
                <input type="datetime-local" id="data" name="data" placeholder="" value="2026-08-07T12:08"  required class="input">
            </div>
            <button type="submit" class="btn-submit">Agendar</button>

           
        </form>
    </section>
</body>
